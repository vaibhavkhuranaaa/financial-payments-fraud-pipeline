name: fraud-decision-workbench

services:
  workbench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8050:8050"
    environment:
      FRAUD_ARTIFACT_ROOT: /app/artifacts
    volumes:
      - ../artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
